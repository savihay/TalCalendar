name: build api
on:
  push:
    branches: [main]
    paths: ['index.html', 'build-api.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build-api.js
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/schedule.json
          git diff --staged --quiet || git commit -m "עדכון אוטומטי של api/schedule.json"
          git push
